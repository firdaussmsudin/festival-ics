name: Scrape and open PR if changed

on:
  # schedule:
  #   - cron: "0 3 * * 1" # every Monday 03:00 UTC — adjust to taste
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Scrape source
        run: npm run scrape

      - name: Merge into dataset
        run: npm run promote

      - name: Validate merged dataset
        run: npm run validate

      # This action diffs the working tree after the steps above. If
      # promote.ts found nothing to change, festivals.json is byte-identical
      # to what's already committed, the diff is empty, and this action
      # skips creating a branch/PR entirely — no empty PRs, no noise.
      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update festival dates from Screendaily"
          title: "Festival data update"
          body: |
            Automated update from the weekly scrape.

            Generated entries default to `category: festival` and
            `status: confirmed` — please check those look right before
            merging, especially for anything that isn't a straightforward
            single-venue festival (markets, forums, conferences).
          branch: automated/festival-data-update
          delete-branch: true
          labels: data-update
